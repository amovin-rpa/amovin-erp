<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP • QR Codes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11; --laranja-escuro: #A04A0E; --amarelo: #F5C518; --verde: #57C220;
  --azul: #1E88E5; --grafite: #1A1A1A; --cinza: #6B7280; --branco: #FFFFFF;
  --vermelho: #E53935; --roxo: #7C3AED; --teal: #00897B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.topo-bar h1 span { color: var(--laranja); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.status-firebase { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; background: #F8F4ED; font-size: 12px; font-weight: 600; border: 1px solid #F0E9DF; }
.status-firebase.conectado { background: #E8F5E9; color: #2E7D32; border-color: #A5D6A7; }
.status-firebase.offline { background: #FFF3E0; color: #E65100; border-color: #FFCC80; }
.status-firebase .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 16px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 22px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; margin-bottom: 20px; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.card h3 .badge { font-size: 10px; font-weight: 600; padding: 3px 12px; border-radius: 20px; background: #FFF3E0; color: var(--laranja); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--laranja); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--laranja); color: white; }
.btn-primary:hover { background: var(--laranja-escuro); }
.btn-success { background: var(--verde); color: white; }
.btn-danger { background: var(--vermelho); color: white; }
.btn-outline { background: transparent; color: var(--cinza); border: 1px solid #E5E0D8; }
.btn-outline:hover { background: #F8F4ED; }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-azul { background: var(--azul); color: white; }
.btn-roxo { background: var(--roxo); color: white; }
.btn-teal { background: var(--teal); color: white; }
.btn-amarelo { background: var(--amarelo); color: #1A1A1A; }
.btn-full { width: 100%; padding: 12px; font-size: 14px; justify-content: center; }
.filtros-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 12px; background: #F8F4ED; border-radius: 10px; }
.filtros-bar select, .filtros-bar input { padding: 8px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 12px; font-family: 'Inter', sans-serif; background: white; }
.filtros-bar .info { font-size: 12px; color: var(--cinza); margin-left: auto; }
.qrcode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.qrcode-item { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; padding: 20px; text-align: center; transition: all 0.3s; }
.qrcode-item:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
.qrcode-item .codigo { font-size: 10px; color: var(--laranja); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
.qrcode-item .qr-image { width: 160px; height: 160px; margin: 0 auto 12px; background: #F8F4ED; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.qrcode-item .qr-image canvas { width: 100% !important; height: 100% !important; }
.qrcode-item .qr-nome { font-weight: 700; font-size: 14px; color: var(--grafite); }
.qrcode-item .qr-desc { font-size: 11px; color: var(--cinza); margin-top: 2px; }
.qrcode-item .qr-validade { font-size: 10px; color: var(--cinza); margin-top: 4px; padding: 2px 10px; border-radius: 12px; display: inline-block; }
.qr-validade.valido { background: #E8F5E9; color: #2E7D32; }
.qr-validade.expirado { background: #FFEBEE; color: #C62828; }
.qr-validade.breve { background: #FFF3E0; color: #E65100; }
.qrcode-item .qr-acoes { margin-top: 12px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.btn-qr { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 10px; }
.sem-dados { text-align: center; padding: 40px; color: #9CA3AF; }
.loading { text-align: center; padding: 40px; color: var(--cinza); }
.loading .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #E5E0D8; border-top: 3px solid var(--laranja); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
.modal-overlay.ativo { display: flex; }
.modal { background: white; border-radius: 16px; padding: 30px; max-width: 500px; width: 100%; max-height: 95vh; overflow-y: auto; margin: auto; }
.modal h2 { font-size: 20px; color: var(--grafite); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal .btn-group { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
.modal .fechar { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--cinza); }
.secao-titulo { font-size: 13px; font-weight: 700; color: var(--laranja); text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--laranja); }
.log-item { padding: 10px 12px; border-bottom: 1px solid #F0E9DF; font-size: 12px; }
.log-item .quando { font-size: 10px; color: var(--cinza); }
.log-item .quem { font-weight: 700; color: var(--laranja); }
.log-item .acao { color: var(--grafite); font-weight: 600; }
.log-item .just { font-size: 11px; color: #666; margin-top: 4px; padding: 6px 10px; background: #FFF8E7; border-radius: 6px; border-left: 3px solid var(--laranja); }
.toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; color: white; font-weight: 600; font-size: 14px; z-index: 10000; box-shadow: 0 8px 32px rgba(0,0,0,0.15); animation: slideInRight 0.4s ease; max-width: 400px; }
.toast-success { background: var(--verde); } .toast-error { background: var(--vermelho); } .toast-warning { background: #E65100; }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; }
.rodape-info .copyright { font-size: 8px; color: #8A8F98; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; }
.rodape-info a { color: #C65A11; text-decoration: none; }
@media (max-width: 900px) { .main-content { margin-left: 0; } .form-row { grid-template-columns: 1fr; } }
</style>
</head>

<script>
// ============================================================
// QR CODES - AMOVIN ERP (Firebase + Auth Master + Log)
// Código: A-QR-YYYY-NNNN
// ============================================================

var qrCodes = [];
var firebasePronto = false;
var db = null;
var acaoPendente = null;
var dadosPendentes = null;
var adminAutenticado = null;

// ============================================================
// FIREBASE
// ============================================================
function inicializarFirebase() {
    if (typeof firebase === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        s.onload = function() {
            var fs = document.createElement('script');
            fs.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
            fs.onload = function() {
                try {
                    var cfg = {
                        apiKey: "AIzaSyDQO-69vVBhmBK8oLt0DzfyigBmjxzu7b4",
                        authDomain: "gestao-amovin.firebaseapp.com",
                        projectId: "gestao-amovin",
                        storageBucket: "gestao-amovin.firebasestorage.app",
                        messagingSenderId: "316793420445",
                        appId: "1:316793420445:web:68e9898bbfcd30853f3274"
                    };
                    if (!firebase.apps.length) firebase.initializeApp(cfg);
                    db = firebase.firestore();
                    firebasePronto = true;
                    atualizarStatusFirebase('conectado');
                    escutarQrCodes();
                } catch (e) { atualizarStatusFirebase('offline'); carregarLocalStorage(); }
            };
            document.head.appendChild(fs);
        };
        document.head.appendChild(s);
    } else {
        try {
            db = firebase.firestore();
            firebasePronto = true;
            atualizarStatusFirebase('conectado');
            escutarQrCodes();
        } catch (e) { atualizarStatusFirebase('offline'); carregarLocalStorage(); }
    }
}
function atualizarStatusFirebase(s) {
    var el = document.getElementById('statusFirebase');
    if (s === 'conectado') { el.className = 'status-firebase conectado'; el.innerHTML = '<span class="dot"></span><span>🟢 Firebase (Tempo Real)</span>'; }
    else { el.className = 'status-firebase offline'; el.innerHTML = '<span class="dot"></span><span>🟡 Modo Local</span>'; }
}
function escutarQrCodes() {
    if (!firebasePronto || !db) { carregarLocalStorage(); return; }
    db.collection('qrcodes').onSnapshot(function(snap) {
        qrCodes = [];
        snap.forEach(function(doc) { qrCodes.push({ _fbId: doc.id, ...doc.data() }); });
        qrCodes.sort(function(a, b) { return (b.criadoEm || '').localeCompare(a.criadoEm || ''); });
        renderizarQRs(); atualizarKPIs();
    });
}
function carregarLocalStorage() {
    qrCodes = JSON.parse(localStorage.getItem('amovin_qrcodes') || '[]');
    renderizarQRs(); atualizarKPIs();
}

// ============================================================
// CÓDIGO A-QR-YYYY-NNNN
// ============================================================
async function gerarProximoCodigo() {
    var ano = new Date().getFullYear();
    var prefixo = 'A-QR-' + ano + '-';
    var max = 0;
    if (firebasePronto && db) {
        try {
            var snap = await db.collection('qrcodes').get();
            snap.forEach(function(doc) {
                var c = doc.data().codigo || '';
                if (c.startsWith(prefixo)) { var n = parseInt(c.replace(prefixo, '')); if (n > max) max = n; }
            });
        } catch (e) {}
    } else {
        qrCodes.forEach(function(q) {
            if (q.codigo && q.codigo.startsWith(prefixo)) { var n = parseInt(q.codigo.replace(prefixo, '')); if (n > max) max = n; }
        });
    }
    return prefixo + String(max + 1).padStart(4, '0');
}

// ============================================================
// AUTH
// ============================================================
function pedirAutenticacao(acao, dados) {
    acaoPendente = acao;
    dadosPendentes = dados || null;
    var msgs = { 'criar': 'Criar novo QR Code', 'editar': 'Editar QR Code', 'excluir': 'Excluir QR Code' };
    document.getElementById('authMsg').textContent = '🔐 ' + (msgs[acao] || acao);
    document.getElementById('authUsuario').value = '';
    document.getElementById('authSenha').value = '';
    document.getElementById('authJust').value = '';
    document.getElementById('contadorJust').textContent = '0/50 caracteres';
    document.getElementById('modalAuth').classList.add('ativo');
    setTimeout(function() { document.getElementById('authUsuario').focus(); }, 200);
}
async function validarAdminMaster(usuario, senha) {
    if (!firebasePronto || !db) {
        var locais = [
            { usuario: 'raul', senha: 'raul8954', nome: 'Raul Ramalho Costa' },
            { usuario: 'daniele', senha: 'daniele2026', nome: 'Daniele Ramalho' },
            { usuario: 'master', senha: 'amovin2026', nome: 'Adm Master Principal' }
        ];
        return locais.find(function(a) { return a.usuario === usuario && a.senha === senha; });
    }
    try {
        var snap = await db.collection('admins_master').where('usuario', '==', usuario).where('ativo', '==', true).get();
        if (snap.empty) return null;
        var admin = null;
        snap.forEach(function(doc) { admin = { _fbId: doc.id, ...doc.data() }; });
        if (admin.senha !== senha) return null;
        return admin;
    } catch (e) { return null; }
}
async function confirmarAuth() {
    var usuario = document.getElementById('authUsuario').value.trim().toLowerCase();
    var senha = document.getElementById('authSenha').value;
    var just = document.getElementById('authJust').value.trim();
    if (!usuario || !senha) { mostrarToast('⚠️ Preencha usuário e senha!', 'warning'); return; }
    if (just.length < 50) { mostrarToast('⚠️ Justificativa mín 50 caracteres!', 'warning'); return; }
    var admin = await validarAdminMaster(usuario, senha);
    if (!admin) { mostrarToast('❌ Usuário ou senha incorretos!', 'error'); return; }
    adminAutenticado = { ...admin, justificativa: just };
    fecharAuth();
    if (acaoPendente === 'criar' || acaoPendente === 'editar') abrirForm(dadosPendentes);
    else if (acaoPendente === 'excluir') executarExclusao(dadosPendentes);
    else if (acaoPendente === 'salvar') salvarQrFinal();
    acaoPendente = null;
}
function fecharAuth() { document.getElementById('modalAuth').classList.remove('ativo'); }
document.getElementById('authJust').addEventListener('input', function() {
    document.getElementById('contadorJust').textContent = this.value.length + '/50 caracteres';
});

// ============================================================
// FORM
// ============================================================
async function abrirForm(qrId) {
    document.getElementById('qrId').value = qrId || '';
    if (qrId) {
        var q = qrCodes.find(function(x) { return x._fbId === qrId; });
        if (q) {
            document.getElementById('modalTitulo').innerHTML = '✏️ Editar: ' + q.nome + ' <button class="fechar" onclick="fecharForm()">×</button>';
            document.getElementById('formCodigo').value = q.codigo || '';
            document.getElementById('formNome').value = q.nome || '';
            document.getElementById('formTipo').value = q.tipo || 'outro';
            document.getElementById('formConteudo').value = q.conteudo || '';
            document.getElementById('formValidade').value = q.diasValidade || 0;
            document.getElementById('formTamanho').value = q.tamanho || 220;
        }
    } else {
        document.getElementById('modalTitulo').innerHTML = '➕ Novo QR Code <button class="fechar" onclick="fecharForm()">×</button>';
        document.getElementById('formNome').value = '';
        document.getElementById('formTipo').value = 'beneficiario';
        document.getElementById('formConteudo').value = '';
        document.getElementById('formValidade').value = '30';
        document.getElementById('formTamanho').value = '220';
        var cod = await gerarProximoCodigo();
        document.getElementById('formCodigo').value = cod;
    }
    document.getElementById('modalForm').classList.add('ativo');
}
function fecharForm() { document.getElementById('modalForm').classList.remove('ativo'); }

// ============================================================
// SALVAR
// ============================================================
function confirmarSalvar() {
    var nome = document.getElementById('formNome').value.trim();
    var conteudo = document.getElementById('formConteudo').value.trim();
    if (!nome) { mostrarToast('⚠️ Nome é obrigatório!', 'warning'); return; }
    if (!conteudo) { mostrarToast('⚠️ Conteúdo é obrigatório!', 'warning'); return; }
    var idEdit = document.getElementById('qrId').value;
    pedirAutenticacao(idEdit ? 'editar' : 'criar', idEdit || null);
}
async function salvarQrFinal() {
    var idEdit = document.getElementById('qrId').value;
    var nome = document.getElementById('formNome').value.trim();
    var dados = {
        codigo: document.getElementById('formCodigo').value,
        nome: nome,
        tipo: document.getElementById('formTipo').value,
        conteudo: document.getElementById('formConteudo').value.trim(),
        diasValidade: parseInt(document.getElementById('formValidade').value) || 0,
        tamanho: parseInt(document.getElementById('formTamanho').value) || 220,
        atualizadoEm: new Date().toISOString()
    };
    var logEntry = {
        data: new Date().toISOString(),
        usuario: adminAutenticado.usuario, nomeUsuario: adminAutenticado.nome,
        acao: idEdit ? 'editado' : 'criado',
        justificativa: adminAutenticado.justificativa,
        detalhes: 'Nome: ' + nome + ' | Tipo: ' + dados.tipo
    };
    if (firebasePronto && db) {
        try {
            if (idEdit) {
                var q = qrCodes.find(function(x) { return x._fbId === idEdit; });
                var hist = (q && q.historico) ? q.historico : [];
                hist.push(logEntry);
                dados.historico = hist;
                await db.collection('qrcodes').doc(idEdit).update(dados);
                mostrarToast('✅ QR Code atualizado!', 'success');
            } else {
                dados.criadoEm = new Date().toISOString();
                dados.dataCriacao = dados.criadoEm;
                dados.historico = [logEntry];
                await db.collection('qrcodes').add(dados);
                mostrarToast('✅ QR Code ' + dados.codigo + ' criado!', 'success');
            }
            fecharForm(); adminAutenticado = null;
        } catch (e) { mostrarToast('❌ Erro: ' + e.message, 'error'); }
    } else {
        if (idEdit) {
            var idx = qrCodes.findIndex(function(x) { return x._fbId === idEdit; });
            if (idx >= 0) {
                var hist = qrCodes[idx].historico || [];
                hist.push(logEntry);
                dados.historico = hist;
                Object.assign(qrCodes[idx], dados);
            }
        } else {
            dados._fbId = Date.now().toString();
            dados.criadoEm = new Date().toISOString();
            dados.dataCriacao = dados.criadoEm;
            dados.historico = [logEntry];
            qrCodes.push(dados);
        }
        localStorage.setItem('amovin_qrcodes', JSON.stringify(qrCodes));
        fecharForm(); renderizarQRs(); atualizarKPIs();
        adminAutenticado = null;
    }
}

// ============================================================
// EXCLUIR
// ============================================================
function excluirQr(fbId) {
    var q = qrCodes.find(function(x) { return x._fbId === fbId; });
    if (!q) return;
    if (!confirm('Excluir QR Code "' + q.nome + '" (' + q.codigo + ')?\n\n⚠️ Esta ação é irreversível.')) return;
    pedirAutenticacao('excluir', fbId);
}
async function executarExclusao(fbId) {
    var q = qrCodes.find(function(x) { return x._fbId === fbId; });
    if (!q) { adminAutenticado = null; return; }
    var logEntry = {
        data: new Date().toISOString(),
        usuario: adminAutenticado.usuario, nomeUsuario: adminAutenticado.nome,
        acao: 'EXCLUÍDO', justificativa: adminAutenticado.justificativa,
        detalhes: q.codigo + ' - ' + q.nome
    };
    if (firebasePronto && db) {
        try {
            await db.collection('logs_exclusao').add({ modulo: 'qrcodes', itemCodigo: q.codigo, itemNome: q.nome, ...logEntry });
            await db.collection('qrcodes').doc(fbId).delete();
            mostrarToast('🗑️ QR Code excluído!', 'info');
        } catch (e) { mostrarToast('❌ ' + e.message, 'error'); }
    } else {
        qrCodes = qrCodes.filter(function(x) { return x._fbId !== fbId; });
        localStorage.setItem('amovin_qrcodes', JSON.stringify(qrCodes));
        renderizarQRs(); atualizarKPIs();
    }
    adminAutenticado = null;
}

// ============================================================
// VALIDADE
// ============================================================
function getStatusValidade(qr) {
    if (!qr.diasValidade || qr.diasValidade === 0) {
        return { status: 'permanente', label: '♾️ Permanente', cls: 'valido' };
    }
    var criacao = new Date(qr.criadoEm || qr.dataCriacao);
    var expiracao = new Date(criacao);
    expiracao.setDate(expiracao.getDate() + qr.diasValidade);
    var agora = new Date();
    var diff = expiracao - agora;
    var diasRestantes = Math.ceil(diff / (1000 * 60 * 60 * 24));
    if (diasRestantes < 0) return { status: 'expirado', label: '❌ Expirado', cls: 'expirado' };
    if (diasRestantes <= 3) return { status: 'breve', label: '⏳ Expira em ' + diasRestantes + 'd', cls: 'breve' };
    return { status: 'valido', label: '✅ Válido (' + diasRestantes + 'd)', cls: 'valido' };
}

// ============================================================
// RENDERIZAR
// ============================================================
function renderizarQRs() {
    var filtro = document.getElementById('filtroStatus').value;
    var tipo = document.getElementById('filtroTipo').value;
    var busca = document.getElementById('filtroBusca').value.toLowerCase();

    var listaFiltrada = qrCodes.filter(function(qr) {
        var status = getStatusValidade(qr);
        if (filtro !== 'todos') {
            if (filtro === 'valido' && status.status !== 'valido' && status.status !== 'permanente') return false;
            if (filtro === 'expirado' && status.status !== 'expirado') return false;
            if (filtro === 'breve' && status.status !== 'breve') return false;
        }
        if (tipo && qr.tipo !== tipo) return false;
        if (busca && (qr.nome || '').toLowerCase().indexOf(busca) === -1 &&
                     (qr.codigo || '').toLowerCase().indexOf(busca) === -1) return false;
        return true;
    });

    document.getElementById('contadorQr').textContent = qrCodes.length + ' QR Code' + (qrCodes.length !== 1 ? 's' : '');
    document.getElementById('contadorFiltro').textContent = listaFiltrada.length + ' de ' + qrCodes.length;

    var container = document.getElementById('listaQrCodes');
    if (listaFiltrada.length === 0) {
        container.innerHTML = '<div class="sem-dados" style="grid-column:1/-1;"><p style="font-size:48px;">📱</p><p style="margin-top:12px;">Nenhum QR Code.</p></div>';
        return;
    }

    var tipoIcon = {
        'beneficiario': '👥', 'profissional': '👨‍⚕️', 'voluntario': '💪',
        'evento': '📅', 'documento': '📄', 'patrimonio': '🏢', 'estoque': '📦', 'outro': '🔗'
    };

    container.innerHTML = listaFiltrada.map(function(qr) {
        var icon = tipoIcon[qr.tipo] || '🔗';
        var status = getStatusValidade(qr);
        var qrId = 'qr-' + qr._fbId.replace(/[^a-zA-Z0-9]/g, '');
        var numLogs = (qr.historico || []).length;
        return '<div class="qrcode-item">' +
            '<div class="codigo">' + (qr.codigo || '---') + '</div>' +
            '<div class="qr-image" id="' + qrId + '"></div>' +
            '<div class="qr-nome">' + qr.nome + '</div>' +
            '<div class="qr-desc">' + icon + ' ' + (qr.tipo || '') + '</div>' +
            '<span class="qr-validade ' + status.cls + '">' + status.label + '</span>' +
            '<div class="qr-acoes">' +
            '<button class="btn-qr btn-azul" onclick="baixarQR(\'' + qr._fbId + '\')">💾</button>' +
            '<button class="btn-qr btn-amarelo" onclick="imprimirQR(\'' + qr._fbId + '\')">🖨️</button>' +
            '<button class="btn-qr btn-roxo" onclick="verLog(\'' + qr._fbId + '\')">📜' + (numLogs ? ' (' + numLogs + ')' : '') + '</button>' +
            '<button class="btn-qr btn-teal" onclick="editarQr(\'' + qr._fbId + '\')">✏️</button>' +
            '<button class="btn-qr btn-danger" onclick="excluirQr(\'' + qr._fbId + '\')">🗑️</button>' +
            '</div></div>';
    }).join('');

    listaFiltrada.forEach(function(qr) {
        var qrId = 'qr-' + qr._fbId.replace(/[^a-zA-Z0-9]/g, '');
        var el = document.getElementById(qrId);
        if (el) {
            try {
                new QRCode(el, {
                    text: qr.conteudo,
                    width: 160, height: 160,
                    colorDark: "#1A1A1A",
                    colorLight: "#FFFFFF",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) { el.innerHTML = '⚠️'; }
        }
    });
}

function editarQr(fbId) { pedirAutenticacao('editar', fbId); }

// ============================================================
// BAIXAR / IMPRIMIR
// ============================================================
function baixarQR(fbId) {
    var qr = qrCodes.find(function(q) { return q._fbId === fbId; });
    if (!qr) return;
    var qrId = 'qr-' + fbId.replace(/[^a-zA-Z0-9]/g, '');
    var container = document.getElementById(qrId);
    var canvas = container.querySelector('canvas');
    if (canvas) {
        var link = document.createElement('a');
        link.download = qr.codigo + '-' + qr.nome.replace(/\s/g, '-') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    } else { mostrarToast('⚠️ QR não encontrado!', 'warning'); }
}
function imprimirQR(fbId) {
    var qr = qrCodes.find(function(q) { return q._fbId === fbId; });
    if (!qr) return;
    var qrId = 'qr-' + fbId.replace(/[^a-zA-Z0-9]/g, '');
    var container = document.getElementById(qrId);
    var canvas = container.querySelector('canvas');
    if (!canvas) { mostrarToast('⚠️ QR não encontrado!', 'warning'); return; }
    var status = getStatusValidade(qr);
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + qr.codigo + '</title>';
    html += '<style>@page{size:80mm 60mm;margin:0;}body{font-family:Arial,sans-serif;margin:0;padding:4mm;text-align:center;}';
    html += '.logo{font-size:8pt;font-weight:bold;color:#C65A11;margin-bottom:2mm;}.codigo{font-size:12pt;font-weight:bold;color:#1A1A1A;letter-spacing:1px;}';
    html += '.nome{font-size:9pt;font-weight:600;margin:1mm 0;}.detalhe{font-size:7pt;color:#666;}.status{font-size:7pt;margin-top:2mm;color:#666;}';
    html += 'img{margin:2mm auto;display:block;}</style></head><body>';
    html += '<div class="logo">🌻 AMOVIN</div>';
    html += '<div class="codigo">' + (qr.codigo || '---') + '</div>';
    html += '<div class="nome">' + qr.nome + '</div>';
    html += '<img src="' + canvas.toDataURL('image/png') + '" width="120" height="120">';
    html += '<div class="detalhe">' + (qr.tipo || '') + '</div>';
    html += '<div class="status">' + status.label + '</div>';
    html += '</body></html>';
    var win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    setTimeout(function() { win.print(); }, 500);
}

// ============================================================
// LOG
// ============================================================
function verLog(fbId) {
    var q = qrCodes.find(function(x) { return x._fbId === fbId; });
    if (!q) return;
    var hist = q.historico || [];
    var container = document.getElementById('conteudoLog');
    if (hist.length === 0) { container.innerHTML = '<div class="sem-dados">Nenhuma alteração.</div>'; }
    else {
        container.innerHTML = hist.slice().reverse().map(function(h) {
            var dt = new Date(h.data).toLocaleString('pt-BR');
            return '<div class="log-item"><div class="quando">' + dt + '</div>' +
                '<div class="quem">👤 ' + (h.nomeUsuario || h.usuario) + ' (@' + h.usuario + ')</div>' +
                '<div class="acao">📌 ' + h.acao + '</div>' +
                (h.detalhes ? '<div style="font-size:11px;color:var(--cinza);">' + h.detalhes + '</div>' : '') +
                (h.justificativa ? '<div class="just"><strong>Justificativa:</strong> ' + h.justificativa + '</div>' : '') +
                '</div>';
        }).join('');
    }
    document.getElementById('modalLog').classList.add('ativo');
}
function fecharLog() { document.getElementById('modalLog').classList.remove('ativo'); }

// ============================================================
// KPIs
// ============================================================
function atualizarKPIs() {
    document.getElementById('kpiTotal').textContent = qrCodes.length;
    var validos = 0, breve = 0, expirados = 0, permanentes = 0;
    qrCodes.forEach(function(q) {
        var s = getStatusValidade(q);
        if (s.status === 'valido') validos++;
        else if (s.status === 'breve') breve++;
        else if (s.status === 'expirado') expirados++;
        else if (s.status === 'permanente') permanentes++;
    });
    document.getElementById('kpiValidos').textContent = validos;
    document.getElementById('kpiBreve').textContent = breve;
    document.getElementById('kpiExpirados').textContent = expirados;
    document.getElementById('kpiPermanentes').textContent = permanentes;
}

// ============================================================
// CSV
// ============================================================
function exportarCSV() {
    var linhas = [['Código', 'Nome', 'Tipo', 'Conteúdo', 'Validade (dias)', 'Criado em']];
    qrCodes.forEach(function(q) {
        linhas.push([q.codigo || '', q.nome || '', q.tipo || '', q.conteudo || '', q.diasValidade || 0, q.criadoEm || '']);
    });
    var csv = linhas.map(function(l) { return l.map(function(c) { return '"' + c + '"'; }).join(';'); }).join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'qrcodes-amovin-' + new Date().toISOString().split('T')[0] + '.csv';
    a.click(); URL.revokeObjectURL(url);
    mostrarToast('📥 CSV exportado!', 'success');
}

function mostrarToast(msg, tipo) {
    var t = document.createElement('div');
    t.className = 'toast toast-' + (tipo || 'success');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

if (!sessionStorage.getItem('amovin_logado') && !localStorage.getItem('amovin_logado')) {
    console.log('⚠️ Sessão não encontrada, mas permitindo acesso.');
}

document.addEventListener('DOMContentLoaded', function() { inicializarFirebase(); });
</script>
