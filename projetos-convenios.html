<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amovin ERP • Projetos e Convênios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --laranja: #C65A11; --laranja-escuro: #A04A0E; --amarelo: #F5C518; --verde: #57C220;
            --azul: #1E88E5; --grafite: #1A1A1A; --cinza: #6B7280; --branco: #FFFFFF;
            --vermelho: #E53935; --roxo: #7C3AED;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

        .main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
        .topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        .topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
        .topo-bar h1 span { color: var(--laranja); }
        .btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .status-firebase {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 20px;
            background: #F8F4ED; font-size: 12px; font-weight: 600;
            border: 1px solid #F0E9DF;
        }
        .status-firebase.conectado { background: #E8F5E9; color: #2E7D32; border-color: #A5D6A7; }
        .status-firebase.offline { background: #FFF3E0; color: #E65100; border-color: #FFCC80; }
        .status-firebase .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
        .kpi-card { background: #FFFFFF; padding: 16px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
        .kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
        .kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

        .card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; margin-bottom: 20px; }
        .card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .card h3 .badge { font-size: 10px; font-weight: 600; padding: 3px 12px; border-radius: 20px; background: #FFF3E0; color: var(--laranja); }

        .btn { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--laranja); color: white; }
        .btn-primary:hover { background: var(--laranja-escuro); }
        .btn-success { background: var(--verde); color: white; }
        .btn-outline { background: transparent; color: var(--cinza); border: 1px solid #E5E0D8; }
        .btn-danger { background: var(--vermelho); color: white; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; background: #FAFAFA; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--laranja); background: white; box-shadow: 0 0 0 3px rgba(198, 90, 17, 0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .projetos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .projeto-card { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; padding: 20px; transition: all 0.3s; }
        .projeto-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        .projeto-card .cabecalho { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }
        .projeto-card .cabecalho .nome { font-size: 16px; font-weight: 700; color: var(--grafite); }
        .projeto-card .cabecalho .status { font-size: 10px; padding: 3px 12px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
        .status-ativo { background: #E8F5E9; color: #2E7D32; }
        .status-concluido { background: #E3F2FD; color: #1565C0; }
        .status-pausado { background: #FFF3E0; color: #E65100; }
        .projeto-card .valor-total { font-size: 24px; font-weight: 800; color: var(--laranja); margin: 4px 0 12px; }
        .projeto-card .categorias { margin: 12px 0; }
        .projeto-card .categoria-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F0E9DF; font-size: 13px; }
        .projeto-card .categoria-item:last-child { border-bottom: none; }
        .projeto-card .categoria-item .cat-nome { color: var(--cinza); }
        .projeto-card .categoria-item .cat-valores { font-weight: 600; }
        .barra-progresso { width: 100%; height: 6px; background: #F0E9DF; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .barra-progresso .fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
        .fill-verde { background: var(--verde); }
        .fill-laranja { background: var(--laranja); }
        .fill-vermelho { background: var(--vermelho); }
        .projeto-card .acoes { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .projeto-card .acoes .btn { font-size: 11px; padding: 6px 14px; }

        .sem-dados { text-align: center; padding: 40px; color: #9CA3AF; }
        .loading { text-align: center; padding: 40px; color: var(--cinza); }
        .loading .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #E5E0D8; border-top: 3px solid var(--laranja); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.ativo { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 30px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 20px; color: var(--grafite); margin-bottom: 16px; }
        .modal .btn-group { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; color: white; font-weight: 600; font-size: 14px; z-index: 10000; box-shadow: 0 8px 32px rgba(0,0,0,0.15); animation: slideInRight 0.4s ease; max-width: 400px; }
        .toast-success { background: var(--verde); }
        .toast-error { background: var(--vermelho); }
        .toast-warning { background: #E65100; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
        .rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .rodape-logo .logo-vigorre { width: 50px; }
        .rodape-info { flex: 1; }
        .rodape-info .copyright { font-size: 8px; color: #8A8F98; }
        .rodape-info .contato { font-size: 9px; color: #8A8F98; }
        .rodape-info a { color: #C65A11; text-decoration: none; }

        @media (max-width: 900px) { .main-content { margin-left: 0; } .projetos-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
    <div class="topo-bar">
        <div>
            <h1>📋 Projetos e Convênios <span>AMOVIN</span></h1>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <div class="status-firebase" id="statusFirebase">
                <span class="dot"></span>
                <span>⏳ Conectando...</span>
            </div>
            <button class="btn btn-primary" onclick="abrirModalNovo()">➕ Novo Projeto</button>
            <button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button>
        </div>
    </div>

    <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-valor" id="kpiTotalProjetos">0</div><div class="kpi-label">📋 Projetos</div></div>
        <div class="kpi-card"><div class="kpi-valor" style="color:var(--verde);" id="kpiOrcamentoTotal">R$ 0</div><div class="kpi-label">💰 Orçamento Total</div></div>
        <div class="kpi-card"><div class="kpi-valor" style="color:#E65100;" id="kpiGastoTotal">R$ 0</div><div class="kpi-label">💳 Total Gasto</div></div>
        <div class="kpi-card"><div class="kpi-valor" style="color:var(--azul);" id="kpiSaldoTotal">R$ 0</div><div class="kpi-label">📊 Saldo</div></div>
    </div>

    <div class="card">
        <h3>📂 Projetos Ativos <span class="badge" id="contadorProjetos">0 projetos</span></h3>
        <div id="projetosLista" class="projetos-grid">
            <div class="loading" style="grid-column:1/-1;">
                <div class="spinner"></div>
                <div>Carregando projetos do Firebase...</div>
            </div>
        </div>
    </div>

    <div class="rodape">
        <div class="rodape-grid">
            <div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';"></div>
            <div class="rodape-info">
                <div class="copyright">© 2026 VIGORRE DESIGNER™</div>
                <div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div>
            </div>
        </div>
    </div>
</main>

<div class="modal-overlay" id="modalNovo">
    <div class="modal">
        <h2 id="modalTitulo">➕ Novo Projeto / Convênio</h2>
        <input type="hidden" id="projetoIdEdit">
        <div class="form-group"><label>📋 Nome do Projeto *</label><input type="text" id="novoNome" placeholder="Ex: Emenda Lud Falcão - Inclusão"></div>
        <div class="form-row">
            <div class="form-group"><label>🏛️ Órgão Concessor</label><input type="text" id="novoOrgao" placeholder="Ex: Prefeitura Municipal"></div>
            <div class="form-group"><label>📜 Nº Termo/Convênio</label><input type="text" id="novoTermo" placeholder="Ex: 08/2026"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>💰 Valor Total *</label><input type="number" id="novoValor" step="0.01" placeholder="0,00"></div>
            <div class="form-group"><label>📅 Vigência</label><input type="date" id="novoVigencia"></div>
        </div>
        <div class="form-group"><label>👤 Parlamentar / Origem</label><input type="text" id="novoParlamentar" placeholder="Ex: Dep. Lud Falcão"></div>
        <div class="form-group"><label>📝 Descrição</label><textarea id="novoDesc" rows="3" placeholder="Objeto do projeto..."></textarea></div>
        <div class="form-group">
            <label>Status</label>
            <select id="novoStatus">
                <option value="ativo">✅ Ativo</option>
                <option value="concluido">📋 Concluído</option>
                <option value="pausado">⏸️ Pausado</option>
            </select>
        </div>
        <div class="btn-group">
            <button class="btn btn-outline" onclick="fecharModalNovo()">Cancelar</button>
            <button class="btn btn-success" onclick="salvarProjeto()">✅ Salvar Projeto</button>
        </div>
    </div>
</div>

<script src="menu.js?v=20260904"></script>
<script>
// ============================================================
// PROJETOS E CONVÊNIOS - AMOVIN ERP (Firebase com TEMPO REAL)
// ============================================================

var projetos = [];
var orcamentos = [];
var firebasePronto = false;
var db = null;
var unsubProjetos = null;
var unsubOrcamentos = null;

// ============================================================
// INICIALIZAR FIREBASE
// ============================================================
function inicializarFirebase() {
    if (typeof firebase === 'undefined') {
        var script = document.createElement('script');
        script.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        script.onload = function() {
            var firestoreScript = document.createElement('script');
            firestoreScript.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
            firestoreScript.onload = function() {
                try {
                    var firebaseConfig = {
                        apiKey: "AIzaSyDQO-69vVBhmBK8oLt0DzfyigBmjxzu7b4",
                        authDomain: "gestao-amovin.firebaseapp.com",
                        projectId: "gestao-amovin",
                        storageBucket: "gestao-amovin.firebasestorage.app",
                        messagingSenderId: "316793420445",
                        appId: "1:316793420445:web:68e9898bbfcd30853f3274"
                    };
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();
                    firebasePronto = true;
                    console.log('🔥 Firebase conectado');
                    atualizarStatusFirebase('conectado');
                    escutarProjetos();
                } catch (e) {
                    console.error('❌ Erro Firebase:', e);
                    atualizarStatusFirebase('offline');
                    carregarLocalStorage();
                }
            };
            firestoreScript.onerror = function() {
                atualizarStatusFirebase('offline');
                carregarLocalStorage();
            };
            document.head.appendChild(firestoreScript);
        };
        script.onerror = function() {
            atualizarStatusFirebase('offline');
            carregarLocalStorage();
        };
        document.head.appendChild(script);
    } else {
        try {
            db = firebase.firestore();
            firebasePronto = true;
            atualizarStatusFirebase('conectado');
            escutarProjetos();
        } catch (e) {
            atualizarStatusFirebase('offline');
            carregarLocalStorage();
        }
    }
}

function atualizarStatusFirebase(status) {
    var el = document.getElementById('statusFirebase');
    if (status === 'conectado') {
        el.className = 'status-firebase conectado';
        el.innerHTML = '<span class="dot"></span><span>🟢 Firebase Conectado (Tempo Real)</span>';
    } else if (status === 'offline') {
        el.className = 'status-firebase offline';
        el.innerHTML = '<span class="dot"></span><span>🟡 Modo Local</span>';
    }
}

// ============================================================
// ESCUTAR PROJETOS EM TEMPO REAL (onSnapshot)
// ============================================================
function escutarProjetos() {
    if (!firebasePronto || !db) { carregarLocalStorage(); return; }

    console.log('🎧 Escutando coleção "projetos" em tempo real...');

    // Escuta PROJETOS
    unsubProjetos = db.collection('projetos').onSnapshot(function(snap) {
        console.log('🔄 Projetos atualizados:', snap.size);
        projetos = [];
        snap.forEach(function(doc) {
            projetos.push({ id: doc.id, _fbId: doc.id, ...doc.data() });
        });
        renderProjetos();
        atualizarKPIs();
    }, function(error) {
        console.error('❌ Erro ao escutar projetos:', error);
        mostrarToast('⚠️ Erro de conexão. Recarregue a página.', 'warning');
        carregarLocalStorage();
    });

    // Escuta ORÇAMENTOS
    unsubOrcamentos = db.collection('orcamentos').onSnapshot(function(snap) {
        console.log('🔄 Orçamentos atualizados:', snap.size);
        orcamentos = [];
        snap.forEach(function(doc) {
            orcamentos.push({ _fbId: doc.id, ...doc.data() });
        });
        renderProjetos();
        atualizarKPIs();
    }, function(error) {
        console.log('ℹ️ Coleção orcamentos ainda não existe');
    });
}

// ============================================================
// FALLBACK: LOCALSTORAGE
// ============================================================
function carregarLocalStorage() {
    console.log('📦 Carregando do localStorage...');
    projetos = JSON.parse(localStorage.getItem('amovin_projetos') || '[]');
    orcamentos = JSON.parse(localStorage.getItem('amovin_orcamentos') || '[]');
    renderProjetos();
    atualizarKPIs();
}

// ============================================================
// RENDERIZAR PROJETOS
// ============================================================
function renderProjetos() {
    var lista = document.getElementById('projetosLista');
    document.getElementById('contadorProjetos').textContent = projetos.length + ' projeto' + (projetos.length !== 1 ? 's' : '');

    if (projetos.length === 0) {
        lista.innerHTML = '<div class="sem-dados" style="grid-column:1/-1;"><p style="font-size:48px;">📋</p><p style="margin-top:12px;">Nenhum projeto cadastrado.</p><button class="btn btn-primary" onclick="abrirModalNovo()" style="margin-top:16px;">➕ Criar Primeiro Projeto</button></div>';
        return;
    }

    lista.innerHTML = projetos.map(function(p) {
        var orcProj = orcamentos.filter(function(o) { return o.projeto_id === p._fbId; });
        var totalPrevisto = orcProj.reduce(function(s, o) { return s + (o.previsto || 0); }, 0);
        var totalRealizado = orcProj.reduce(function(s, o) { return s + (o.realizado || 0); }, 0);
        var percentual = totalPrevisto > 0 ? Math.min(100, (totalRealizado / totalPrevisto) * 100) : 0;
        var corBarra = percentual < 70 ? 'fill-verde' : (percentual < 90 ? 'fill-laranja' : 'fill-vermelho');
        var statusClass = p.status === 'concluido' ? 'status-concluido' : (p.status === 'pausado' ? 'status-pausado' : 'status-ativo');
        var statusTexto = p.status === 'concluido' ? 'Concluído' : (p.status === 'pausado' ? 'Pausado' : 'Ativo');

        var categoriasHtml = '';
        if (orcProj.length > 0) {
            categoriasHtml = '<div class="categorias">' + orcProj.map(function(o) {
                return '<div class="categoria-item"><span class="cat-nome">' + o.categoria + '</span><span class="cat-valores">R$ ' + (o.realizado || 0).toFixed(2).replace('.', ',') + ' / R$ ' + (o.previsto || 0).toFixed(2).replace('.', ',') + '</span></div>';
            }).join('') + '</div>';
        }

        return '<div class="projeto-card">' +
            '<div class="cabecalho"><span class="nome">' + (p.nome || 'Sem nome') + '</span><span class="status ' + statusClass + '">' + statusTexto + '</span></div>' +
            '<div style="font-size:12px;color:var(--cinza);margin-bottom:4px;">' + (p.orgao || '---') + ' • Termo ' + (p.termo || '---') + '</div>' +
            (p.parlamentar ? '<div style="font-size:11px;color:var(--roxo);margin-bottom:8px;">👤 ' + p.parlamentar + '</div>' : '') +
            '<div class="valor-total">R$ ' + (p.orcamento_total || 0).toFixed(2).replace('.', ',') + '</div>' +
            '<div style="font-size:12px;color:var(--cinza);margin-bottom:4px;">Execução: R$ ' + totalRealizado.toFixed(2).replace('.', ',') + ' de R$ ' + totalPrevisto.toFixed(2).replace('.', ',') + '</div>' +
            '<div class="barra-progresso"><div class="fill ' + corBarra + '" style="width:' + percentual + '%;"></div></div>' +
            categoriasHtml +
            '<div class="acoes">' +
            '<button class="btn btn-outline" onclick="verDetalhes(\'' + p._fbId + '\')">👁️ Ver</button>' +
            '<button class="btn btn-outline" onclick="editarProjeto(\'' + p._fbId + '\')">✏️ Editar</button>' +
            '<button class="btn btn-outline" onclick="alterarStatus(\'' + p._fbId + '\')">🔄 Status</button>' +
            '<button class="btn btn-danger" onclick="excluirProjeto(\'' + p._fbId + '\')">🗑️</button>' +
            '</div>' +
            '</div>';
    }).join('');
}

// ============================================================
// KPIs
// ============================================================
function atualizarKPIs() {
    document.getElementById('kpiTotalProjetos').textContent = projetos.length;
    var totalPrevisto = 0, totalRealizado = 0;
    orcamentos.forEach(function(o) {
        totalPrevisto += o.previsto || 0;
        totalRealizado += o.realizado || 0;
    });
    if (orcamentos.length === 0) {
        totalPrevisto = projetos.reduce(function(s, p) { return s + (p.orcamento_total || 0); }, 0);
    }
    document.getElementById('kpiOrcamentoTotal').textContent = 'R$ ' + totalPrevisto.toFixed(2).replace('.', ',');
    document.getElementById('kpiGastoTotal').textContent = 'R$ ' + totalRealizado.toFixed(2).replace('.', ',');
    document.getElementById('kpiSaldoTotal').textContent = 'R$ ' + (totalPrevisto - totalRealizado).toFixed(2).replace('.', ',');
}

// ============================================================
// MODAL
// ============================================================
function abrirModalNovo() {
    document.getElementById('modalTitulo').textContent = '➕ Novo Projeto / Convênio';
    document.getElementById('projetoIdEdit').value = '';
    limparFormulario();
    document.getElementById('modalNovo').classList.add('ativo');
}
function fecharModalNovo() { document.getElementById('modalNovo').classList.remove('ativo'); }
function limparFormulario() {
    ['novoNome','novoOrgao','novoTermo','novoValor','novoVigencia','novoParlamentar','novoDesc'].forEach(function(id) {
        document.getElementById(id).value = '';
    });
    document.getElementById('novoStatus').value = 'ativo';
}

// ============================================================
// SALVAR PROJETO
// ============================================================
async function salvarProjeto() {
    var nome = document.getElementById('novoNome').value.trim();
    var valor = parseFloat(document.getElementById('novoValor').value) || 0;
    if (!nome) { mostrarToast('⚠️ Nome é obrigatório!', 'warning'); return; }
    if (valor <= 0) { mostrarToast('⚠️ Informe um valor válido!', 'warning'); return; }

    var dados = {
        nome: nome,
        orgao: document.getElementById('novoOrgao').value.trim(),
        termo: document.getElementById('novoTermo').value.trim(),
        parlamentar: document.getElementById('novoParlamentar').value.trim(),
        descricao: document.getElementById('novoDesc').value.trim(),
        orcamento_total: valor,
        vigencia: document.getElementById('novoVigencia').value,
        status: document.getElementById('novoStatus').value,
        atualizadoEm: new Date().toISOString()
    };

    var idEdit = document.getElementById('projetoIdEdit').value;

    if (firebasePronto && db) {
        try {
            if (idEdit) {
                // UPDATE
                await db.collection('projetos').doc(idEdit).update(dados);
                mostrarToast('✅ Projeto atualizado!', 'success');
            } else {
                // CREATE
                dados.data_criacao = new Date().toISOString();
                var ref = await db.collection('projetos').add(dados);
                await criarOrcamentosPadrao(ref.id, valor);
                mostrarToast('✅ Projeto criado!', 'success');
            }
            fecharModalNovo();
            // O onSnapshot já vai atualizar a tela automaticamente
        } catch (e) {
            console.error('❌ Erro Firebase:', e);
            mostrarToast('❌ Erro: ' + e.message, 'error');
        }
    } else {
        if (idEdit) {
            var idx = projetos.findIndex(function(p) { return p._fbId === idEdit; });
            if (idx >= 0) Object.assign(projetos[idx], dados);
        } else {
            dados.id = Date.now();
            projetos.push(dados);
        }
        localStorage.setItem('amovin_projetos', JSON.stringify(projetos));
        fecharModalNovo();
        renderProjetos();
        atualizarKPIs();
        mostrarToast('✅ Projeto salvo localmente!', 'success');
    }
}

async function criarOrcamentosPadrao(projetoId, total) {
    if (!firebasePronto || !db) return;
    try {
        var categorias = ['Equipamentos', 'Materiais', 'Serviços', 'Capacitação', 'Infraestrutura', 'Outros'];
        var distribuicao = [0.35, 0.25, 0.20, 0.10, 0.05, 0.05];
        for (var i = 0; i < categorias.length; i++) {
            await db.collection('orcamentos').add({
                projeto_id: projetoId,
                categoria: categorias[i],
                previsto: Math.round(total * distribuicao[i] * 100) / 100,
                realizado: 0,
                data_criacao: new Date().toISOString()
            });
        }
    } catch (e) {
        console.log('ℹ️ Orçamentos não criados:', e.message);
    }
}

// ============================================================
// EDITAR
// ============================================================
function editarProjeto(fbId) {
    var p = projetos.find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    document.getElementById('modalTitulo').textContent = '✏️ Editar: ' + p.nome;
    document.getElementById('projetoIdEdit').value = fbId;
    document.getElementById('novoNome').value = p.nome || '';
    document.getElementById('novoOrgao').value = p.orgao || '';
    document.getElementById('novoTermo').value = p.termo || '';
    document.getElementById('novoValor').value = p.orcamento_total || '';
    document.getElementById('novoVigencia').value = p.vigencia || '';
    document.getElementById('novoParlamentar').value = p.parlamentar || '';
    document.getElementById('novoDesc').value = p.descricao || '';
    document.getElementById('novoStatus').value = p.status || 'ativo';
    document.getElementById('modalNovo').classList.add('ativo');
}

// ============================================================
// VER DETALHES// ============================================================
function verDetalhes(fbId) {
    var p = projetos.find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    alert('📋 ' + p.nome + '\n\n🏛️ Órgão: ' + (p.orgao || '---') + '\n📜 Termo: ' + (p.termo || '---') + '\n💰 Valor: R$ ' + (p.orcamento_total || 0).toFixed(2).replace('.', ',') + '\n📅 Vigência: ' + (p.vigencia || '---') + '\n👤 Parlamentar: ' + (p.parlamentar || '---') + '\n\n📝 ' + (p.descricao || 'Sem descrição'));
}

// ============================================================
// ALTERAR STATUS
// ============================================================
async function alterarStatus(fbId) {
    var p = projetos.find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    var novoStatus = prompt('Status (ativo / concluido / pausado):', p.status || 'ativo');
    if (!novoStatus) return;
    novoStatus = novoStatus.toLowerCase();
    if (['ativo', 'concluido', 'pausado'].indexOf(novoStatus) === -1) {
        mostrarToast('⚠️ Status inválido!', 'warning');
        return;
    }
    if (firebasePronto && db) {
        try {
            await db.collection('projetos').doc(fbId).update({ status: novoStatus, atualizadoEm: new Date().toISOString() });
            mostrarToast('✅ Status atualizado!', 'success');
        } catch (e) {
            mostrarToast('❌ Erro: ' + e.message, 'error');
        }
    } else {
        p.status = novoStatus;
        localStorage.setItem('amovin_projetos', JSON.stringify(projetos));
        renderProjetos();
    }
}

// ============================================================
// EXCLUIR
// ============================================================
async function excluirProjeto(fbId) {
    var p = projetos.find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    if (!confirm('Excluir o projeto "' + p.nome + '"?\n\nOrçamentos vinculados também serão removidos.')) return;

    if (firebasePronto && db) {
        try {
            await db.collection('projetos').doc(fbId).delete();
            var orcSnap = await db.collection('orcamentos').where('projeto_id', '==', fbId).get();
            var batch = db.batch();
            orcSnap.forEach(function(doc) { batch.delete(doc.ref); });
            await batch.commit();
            mostrarToast('🗑️ Projeto excluído!', 'info');
        } catch (e) {
            mostrarToast('❌ Erro: ' + e.message, 'error');
        }
    } else {
        projetos = projetos.filter(function(x) { return x._fbId !== fbId; });
        localStorage.setItem('amovin_projetos', JSON.stringify(projetos));
        renderProjetos();
        atualizarKPIs();
    }
}

// ============================================================
// TOAST
// ============================================================
function mostrarToast(msg, tipo) {
    var t = document.createElement('div');
    t.className = 'toast toast-' + (tipo || 'success');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

// ============================================================
// SESSÃO
// ============================================================
if (!sessionStorage.getItem('amovin_logado') && !localStorage.getItem('amovin_logado')) {
    console.log('⚠️ Sessão não encontrada, mas permitindo acesso.');
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    inicializarFirebase();
});
</script>
